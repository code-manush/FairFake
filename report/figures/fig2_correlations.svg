<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%" style="font-family:'Times New Roman',serif;background:#fff;">
      <style>
        .title { font-size: 14px; font-weight: bold; fill: #111; text-anchor: middle; }
        .head { font-size: 10px; font-weight: bold; fill: #222; }
        .cell-text { font-size: 9px; fill: #fff; font-weight: bold; text-anchor: middle; }
      </style>
      
      <g transform="translate(60, 30)">
        <text x="360" y="0" class="title">Top Pairwise Attribute Pearson Correlation Coefficients</text>
        
        <!-- Legend bar -->
        <g transform="translate(180, 20)">
          <text x="-50" y="11" font-size="10" fill="#333">-1.0 (Neg)</text>
          <rect x="0" y="0" width="60" height="14" fill="#ef4444"/>
          <rect x="60" y="0" width="60" height="14" fill="#f87171"/>
          <rect x="120" y="0" width="60" height="14" fill="#f3f4f6"/>
          <rect x="180" y="0" width="60" height="14" fill="#86efac"/>
          <rect x="240" y="0" width="60" height="14" fill="#22c55e"/>
          <text x="310" y="11" font-size="10" fill="#333">+1.0 (Pos)</text>
        </g>
      </g>
      
      <!-- Subplot A: Highly Positive Correlations -->
      <g transform="translate(50, 90)">
        <text x="180" y="0" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Strong Positive Correlations (Co-occurring)</text>
        <rect x="20" y="15" width="320" height="280" fill="#f9fafb" stroke="#e5e7eb" rx="4"/>
        
        <!-- Pair list -->
    
        <text x="35" y="47" font-size="10" fill="#1f2937">Mustache & Goatee</text>
        <rect x="200" y="35" width="84.0" height="16" fill="#15803d" rx="2"/>
        <text x="289.0" y="47" font-size="10" font-weight="bold" fill="#111">+0.84</text>
        
        <text x="35" y="79" font-size="10" fill="#1f2937">Heavy Makeup & Lipstick</text>
        <rect x="200" y="67" width="79.0" height="16" fill="#16a34a" rx="2"/>
        <text x="284.0" y="79" font-size="10" font-weight="bold" fill="#111">+0.79</text>
        
        <text x="35" y="111" font-size="10" fill="#1f2937">Double Chin & Chubby</text>
        <rect x="200" y="99" width="76.0" height="16" fill="#16a34a" rx="2"/>
        <text x="281.0" y="111" font-size="10" font-weight="bold" fill="#111">+0.76</text>
        
        <text x="35" y="143" font-size="10" fill="#1f2937">Black Hair & Asian</text>
        <rect x="200" y="131" width="68.0" height="16" fill="#22c55e" rx="2"/>
        <text x="273.0" y="143" font-size="10" font-weight="bold" fill="#111">+0.68</text>
        
        <text x="35" y="175" font-size="10" fill="#1f2937">Bald & Receding Hairline</text>
        <rect x="200" y="163" width="64.0" height="16" fill="#22c55e" rx="2"/>
        <text x="269.0" y="175" font-size="10" font-weight="bold" fill="#111">+0.64</text>
        
        <text x="35" y="207" font-size="10" fill="#1f2937">Smiling & Mouth Open</text>
        <rect x="200" y="195" width="61.0" height="16" fill="#4ade80" rx="2"/>
        <text x="266.0" y="207" font-size="10" font-weight="bold" fill="#111">+0.61</text>
        
        <text x="35" y="239" font-size="10" fill="#1f2937">Wavy Hair & Female</text>
        <rect x="200" y="227" width="55.0" height="16" fill="#4ade80" rx="2"/>
        <text x="260.0" y="239" font-size="10" font-weight="bold" fill="#111">+0.55</text>
        
        <text x="35" y="271" font-size="10" fill="#1f2937">Blond Hair & Female</text>
        <rect x="200" y="259" width="52.0" height="16" fill="#4ade80" rx="2"/>
        <text x="257.0" y="271" font-size="10" font-weight="bold" fill="#111">+0.52</text>
        </g>

      <!-- Subplot B: Highly Negative Correlations -->
      <g transform="translate(450, 90)">
        <text x="180" y="0" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">Strong Negative Correlations (Mutually Exclusive)</text>
        <rect x="20" y="15" width="320" height="280" fill="#f9fafb" stroke="#e5e7eb" rx="4"/>
    
        <text x="35" y="47" font-size="10" fill="#1f2937">No Beard & Mustache</text>
        <rect x="200" y="35" width="88.0" height="16" fill="#b91c1c" rx="2"/>
        <text x="293.0" y="47" font-size="10" font-weight="bold" fill="#111">-0.88</text>
        
        <text x="35" y="79" font-size="10" fill="#1f2937">No Beard & Goatee</text>
        <rect x="200" y="67" width="85.0" height="16" fill="#b91c1c" rx="2"/>
        <text x="290.0" y="79" font-size="10" font-weight="bold" fill="#111">-0.85</text>
        
        <text x="35" y="111" font-size="10" fill="#1f2937">Heavy Makeup & Male</text>
        <rect x="200" y="99" width="76.0" height="16" fill="#dc2626" rx="2"/>
        <text x="281.0" y="111" font-size="10" font-weight="bold" fill="#111">-0.76</text>
        
        <text x="35" y="143" font-size="10" fill="#1f2937">Wearing Lipstick & Male</text>
        <rect x="200" y="131" width="74.0" height="16" fill="#dc2626" rx="2"/>
        <text x="279.0" y="143" font-size="10" font-weight="bold" fill="#111">-0.74</text>
        
        <text x="35" y="175" font-size="10" fill="#1f2937">Mustache & Female</text>
        <rect x="200" y="163" width="69.0" height="16" fill="#ef4444" rx="2"/>
        <text x="274.0" y="175" font-size="10" font-weight="bold" fill="#111">-0.69</text>
        
        <text x="35" y="207" font-size="10" fill="#1f2937">Goatee & Female</text>
        <rect x="200" y="195" width="67.0" height="16" fill="#ef4444" rx="2"/>
        <text x="272.0" y="207" font-size="10" font-weight="bold" fill="#111">-0.67</text>
        
        <text x="35" y="239" font-size="10" fill="#1f2937">Bald & Bangs</text>
        <rect x="200" y="227" width="58.0" height="16" fill="#f87171" rx="2"/>
        <text x="263.0" y="239" font-size="10" font-weight="bold" fill="#111">-0.58</text>
        
        <text x="35" y="271" font-size="10" fill="#1f2937">Senior & Young</text>
        <rect x="200" y="259" width="54.0" height="16" fill="#f87171" rx="2"/>
        <text x="259.0" y="271" font-size="10" font-weight="bold" fill="#111">-0.54</text>
        </g>
    </svg>